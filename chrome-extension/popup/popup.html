<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salvavidas - AI Meeting Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      padding: 0;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    /* Content */
    .content {
      background: white;
      padding: 20px;
    }

    /* Status Section */
    .status-section {
      margin-bottom: 24px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 12px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      color: #6b7280;
      font-weight: 500;
    }

    .status-value {
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
    }

    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-indicator.connected {
      background: #10b981;
    }

    .status-indicator.disconnected {
      background: #ef4444;
    }

    /* Controls */
    .controls {
      margin-bottom: 24px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 14px;
      color: #374151;
      cursor: pointer;
      font-weight: normal;
    }

    /* Buttons */
    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    /* Footer */
    .footer {
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .footer-links a {
      font-size: 12px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer-version {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Notifications */
    .notification {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .notification.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .notification.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }

    .notification.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Info Box */
    .info-box {
      background: #eff6ff;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #1e40af;
    }

    .info-box strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚁 Salvavidas</h1>
      <p>AI-Powered Meeting Assistant</p>
    </div>

    <div class="content">
      <!-- Notification -->
      <div id="notification" class="notification"></div>

      <!-- Status Section -->
      <div class="status-section">
        <div class="status-item">
          <span class="status-label">Backend Status</span>
          <span class="status-value">
            <span id="backend-status-indicator" class="status-indicator disconnected"></span>
            <span id="backend-status-text">Checking...</span>
          </span>
        </div>
        <div class="status-item">
          <span class="status-label">Recording</span>
          <span class="status-value" id="recording-status">Stopped</span>
        </div>
      </div>

      <!-- Info Box -->
      <div class="info-box">
        <strong>⚠️ Backend Required</strong>
        Make sure the Salvavidas backend is running on localhost:8000 before starting a meeting.
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="control-group">
          <label for="backend-url">Backend URL</label>
          <input type="text" id="backend-url" placeholder="ws://localhost:8000/ws" />
        </div>

        <div class="control-group">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="meeting_assistant">Meeting Assistant (Full Features)</option>
            <option value="translator">Translator Only</option>
          </select>
        </div>

        <div class="control-group">
          <label for="processing-mode">Processing Mode</label>
          <select id="processing-mode">
            <option value="local">Local (Free, Slower)</option>
            <option value="fast">API Fast (Balanced)</option>
            <option value="premium">API Premium (Best Quality)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="language">Target Language</label>
          <select id="language">
            <option value="en">🇺🇸 English</option>
            <option value="pt">🇧🇷 Portuguese</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
            <option value="it">🇮🇹 Italian</option>
            <option value="zh">🇨🇳 Chinese</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ko">🇰🇷 Korean</option>
          </select>
        </div>

        <div class="control-group">
          <label for="source-language">Source Language</label>
          <select id="source-language">
            <option value="">Auto-detect</option>
            <option value="en">English</option>
            <option value="pt">Portuguese</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
          </select>
        </div>

        <div class="control-group">
          <div class="checkbox-group">
            <input type="checkbox" id="auto-start" />
            <label for="auto-start" class="checkbox-label">Auto-start on meeting pages</label>
          </div>
        </div>

        <div class="control-group">
          <div class="checkbox-group">
            <input type="checkbox" id="enable-speaker-id" checked />
            <label for="enable-speaker-id" class="checkbox-label">Enable Speaker Identification</label>
          </div>
        </div>

        <div class="control-group">
          <div class="checkbox-group">
            <input type="checkbox" id="enable-suggestions" checked />
            <label for="enable-suggestions" class="checkbox-label">Enable AI Suggestions</label>
          </div>
        </div>

        <div class="control-group">
          <div class="checkbox-group">
            <input type="checkbox" id="enable-sentiment" checked />
            <label for="enable-sentiment" class="checkbox-label">Enable Sentiment Analysis</label>
          </div>
        </div>

        <div class="control-group">
          <div class="checkbox-group">
            <input type="checkbox" id="show-latency" checked />
            <label for="show-latency" class="checkbox-label">Show Performance Monitor</label>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button id="btn-save" class="btn-secondary">Save Settings</button>
        <button id="btn-test" class="btn-secondary">Test Connection</button>
      </div>

      <div class="button-group">
        <button id="btn-start" class="btn-success">Start Assistant</button>
        <button id="btn-stop" class="btn-danger" disabled>Stop Assistant</button>
      </div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="https://github.com/marvinmvns/Salvavidas" target="_blank">GitHub</a>
        <a href="https://github.com/marvinmvns/Salvavidas#readme" target="_blank">Documentation</a>
        <a href="https://github.com/marvinmvns/Salvavidas/issues" target="_blank">Support</a>
      </div>
      <div class="footer-version">Version 1.0.0</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
