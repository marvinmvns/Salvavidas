<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvavidas Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: white;
            overflow: hidden;
            -webkit-app-region: drag; /* Make window draggable */
            user-select: none;
        }

        .overlay-container {
            width: 100%;
            height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .overlay-header {
            background: rgba(0, 0, 0, 0.95);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            -webkit-app-region: no-drag;
        }

        .overlay-header h3 {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .suggestion-card {
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            -webkit-app-region: no-drag;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .suggestion-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #667eea;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .suggestion-text {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .suggestion-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .listening-indicator {
            background: rgba(0, 0, 0, 0.95);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.3);
            }
        }

        .listening-text {
            font-size: 0.85rem;
        }

        .shortcuts-hint {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-top: auto;
        }

        .invisible-to-capture {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76, 175, 80, 0.9);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .audio-controls {
            background: rgba(0, 0, 0, 0.95);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .control-label {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-record {
            background: #f56565;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-record:hover {
            background: #e53e3e;
        }

        .btn-record.recording {
            background: #48bb78;
        }

        .btn-record.recording:hover {
            background: #38a169;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #48bb78;
        }

        .status-dot.disconnected {
            background: #f56565;
        }

        /* Latency Monitor */
        .latency-monitor {
            background: rgba(0, 0, 0, 0.95);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-family: 'Courier New', monospace;
            -webkit-app-region: no-drag;
        }

        .latency-title {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.75rem;
        }

        .latency-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        .latency-value {
            font-weight: bold;
            color: #48bb78;
        }

        .latency-value.warning {
            color: #f6ad55;
        }

        .latency-value.critical {
            color: #f56565;
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <div class="overlay-header">
            <h3>
                <span>🚁</span>
                Salvavidas
            </h3>
            <button class="close-btn" onclick="closeOverlay()">×</button>
        </div>

        <div class="audio-controls">
            <div class="control-row">
                <span class="control-label">🎤 Teams Audio Capture</span>
                <span class="status-badge">
                    <span class="status-dot" id="connection-dot"></span>
                    <span id="connection-status">Disconnected</span>
                </span>
            </div>
            <div class="control-row">
                <button class="btn-record" id="record-btn" onclick="toggleRecording()">
                    ● Start Capture
                </button>
            </div>
            <div class="control-row">
                <span style="font-size: 0.7rem; color: rgba(255, 255, 255, 0.6);">
                    Captures: Microphone + System Audio
                </span>
            </div>
        </div>

        <div class="listening-indicator">
            <div class="pulse"></div>
            <div class="listening-text" id="listening-text">
                Waiting for speech...
            </div>
        </div>

        <div id="suggestions-container">
            <!-- Suggestions will be added here dynamically -->
        </div>

        <div class="latency-monitor">
            <div class="latency-title">⚡ Performance</div>
            <div class="latency-item">
                <span>STT:</span>
                <span class="latency-value" id="lat-stt">--ms</span>
            </div>
            <div class="latency-item">
                <span>Speaker:</span>
                <span class="latency-value" id="lat-speaker">--ms</span>
            </div>
            <div class="latency-item">
                <span>Total:</span>
                <span class="latency-value" id="lat-total">--ms</span>
            </div>
        </div>

        <div class="shortcuts-hint">
            Ctrl+Shift+O: Toggle | Ctrl+Shift+I: Invisible | Ctrl+Shift+H: Hide All
        </div>

        <div class="invisible-to-capture">
            📹 Invisible to Screen Capture
        </div>
    </div>

    <!-- Audio Client Library -->
    <script src="audio-client.js"></script>

    <script>
        // Audio client instance
        let audioClient = null;
        let isRecording = false;

        // Initialize audio client
        async function initializeAudioClient() {
            try {
                audioClient = new AudioClient('ws://localhost:8000/ws/voice');

                // Setup event listeners
                audioClient.on('ready', () => {
                    updateConnectionStatus(true);
                    console.log('[Overlay] Server ready');
                });

                audioClient.on('transcription', handleMessage);

                audioClient.on('error', (error) => {
                    console.error('[Overlay] Server error:', error);
                    document.getElementById('listening-text').textContent = `Error: ${error.message}`;
                });

                audioClient.on('disconnected', () => {
                    updateConnectionStatus(false);
                    document.getElementById('listening-text').textContent = 'Disconnected from server';
                });

                // Initialize with Teams audio capture
                await audioClient.initialize({
                    captureMicrophone: true,
                    captureSystemAudio: true,
                    mixStreams: true,
                    sampleRate: 16000
                });

                console.log('[Overlay] Audio client initialized');
                updateConnectionStatus(true);

            } catch (error) {
                console.error('[Overlay] Failed to initialize audio client:', error);
                document.getElementById('listening-text').textContent = `Init error: ${error.message}`;
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('connection-dot');
            const statusText = document.getElementById('connection-status');

            if (connected) {
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
            }
        }

        async function toggleRecording() {
            if (!audioClient) {
                alert('Audio client not initialized. Please wait...');
                return;
            }

            const btn = document.getElementById('record-btn');

            if (isRecording) {
                // Stop recording
                audioClient.stop();
                isRecording = false;
                btn.textContent = '● Start Capture';
                btn.classList.remove('recording');
                document.getElementById('listening-text').textContent = 'Stopped';

            } else {
                // Start recording
                audioClient.start();
                isRecording = true;
                btn.textContent = '■ Stop Capture';
                btn.classList.add('recording');
                document.getElementById('listening-text').textContent = 'Capturing audio...';
            }
        }

        function handleMessage(data) {
            if (data.type === 'transcription') {
                // Update listening text
                document.getElementById('listening-text').textContent =
                    data.original_text.substring(0, 40) + '...';

                // Display suggestions
                if (data.suggestions && data.suggestions.length > 0) {
                    displaySuggestions(data.suggestions);
                }

                // Update performance metrics
                if (data.performance) {
                    updateLatencies(data.performance);
                }
            }
        }

        function updateLatencies(perf) {
            const update = (id, value) => {
                const el = document.getElementById(id);
                if (el) {
                    el.textContent = `${value}ms`;
                    el.className = 'latency-value';
                    if (value > 1000) el.classList.add('critical');
                    else if (value > 500) el.classList.add('warning');
                }
            };

            update('lat-stt', perf.stt_latency_ms);
            update('lat-speaker', perf.speaker_latency_ms);
            update('lat-total', perf.total_latency_ms);
        }

        function displaySuggestions(suggestions) {
            const container = document.getElementById('suggestions-container');

            // Clear old suggestions
            container.innerHTML = '';

            // Show top 2 suggestions
            suggestions.slice(0, 2).forEach((sug, index) => {
                const card = document.createElement('div');
                card.className = 'suggestion-card';
                card.innerHTML = `
                    <div class="suggestion-type">Suggestion ${index + 1}</div>
                    <div class="suggestion-text">${sug.text}</div>
                    <div class="suggestion-actions">
                        <button class="btn btn-primary" onclick='useSuggestion(\`${sug.text}\`)'>
                            Use
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function useSuggestion(text) {
            // Copy to clipboard
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Copied to clipboard!');
            });
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(76, 175, 80, 0.95);
                color: white;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 0.85rem;
                animation: slideIn 0.3s ease-out;
                z-index: 1000;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 2000);
        }

        function closeOverlay() {
            // Cleanup before closing
            if (audioClient) {
                audioClient.cleanup();
            }

            if (window.electronAPI) {
                window.electronAPI.toggleOverlay();
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('[Overlay] DOM loaded, initializing audio client...');
            initializeAudioClient().catch(error => {
                console.error('[Overlay] Failed to initialize:', error);
            });
        });

        // Listen for Teams meeting events
        if (window.electronAPI && window.electronAPI.on) {
            window.electronAPI.on('teams-meeting-started', (meetingInfo) => {
                console.log('[Overlay] Teams meeting started:', meetingInfo);
                showNotification('Teams meeting detected! Ready to assist.');
                // Auto-start recording if not already recording
                if (!isRecording) {
                    setTimeout(() => toggleRecording(), 1000);
                }
            });

            window.electronAPI.on('teams-meeting-ended', () => {
                console.log('[Overlay] Teams meeting ended');
                showNotification('Teams meeting ended. Thanks!');
                // Auto-stop recording
                if (isRecording) {
                    toggleRecording();
                }
            });
        }
    </script>
</body>
</html>
