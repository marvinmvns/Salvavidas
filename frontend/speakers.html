<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvavidas Speaker Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            transition: all 0.2s ease;
        }

        .tab:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .content-section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .enrollment-step {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .enrollment-step h3 {
            color: #374151;
            margin-bottom: 16px;
        }

        .progress-bar {
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s ease;
        }

        .sample-item {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .speakers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .speaker-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }

        .speaker-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .speaker-card h3 {
            color: #1f2937;
            margin-bottom: 8px;
        }

        .speaker-meta {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .speaker-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .stat-item {
            font-size: 12px;
            color: #6b7280;
        }

        .stat-value {
            font-weight: 600;
            color: #1f2937;
        }

        .notification {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .notification.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .notification.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .notification.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .record-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: #667eea;
            color: white;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }

        .record-button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .record-button.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Speaker Management</h1>
            <p class="subtitle">Enroll and manage speakers for voice recognition</p>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('enroll')">Enroll Speaker</button>
                <button class="tab" onclick="switchTab('list')">All Speakers</button>
            </div>
        </div>

        <div id="notification" class="notification"></div>

        <!-- Enrollment Section -->
        <div id="enroll-section" class="content-section active">
            <div class="enrollment-step" id="step-info">
                <h3>Step 1: Speaker Information</h3>
                <div class="form-group">
                    <label>Speaker Name *</label>
                    <input type="text" id="speaker-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email (optional)</label>
                    <input type="email" id="speaker-email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Language</label>
                    <select id="speaker-language">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="pt">Portuguese</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="startEnrollment()">Start Enrollment</button>
            </div>

            <div class="enrollment-step" id="step-recording" style="display: none;">
                <h3>Step 2: Record Voice Samples</h3>
                <p style="margin-bottom: 20px; color: #6b7280;">Record at least 3 voice samples (5-10 seconds each)</p>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress" style="width: 0%"></div>
                </div>

                <div style="text-align: center;">
                    <p id="sample-count" style="margin-bottom: 10px; font-weight: 600;">Samples: 0/3</p>
                    <button class="record-button" id="record-btn" onclick="toggleRecording()">🎤</button>
                    <p id="recording-status">Click to record</p>
                </div>

                <div id="samples-list" style="margin-top: 20px;"></div>

                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button class="btn-danger" onclick="cancelEnrollment()">Cancel</button>
                    <button class="btn-primary" id="complete-btn" onclick="completeEnrollment()" disabled>Complete Enrollment</button>
                </div>
            </div>
        </div>

        <!-- Speakers List Section -->
        <div id="list-section" class="content-section">
            <div style="margin-bottom: 20px;">
                <button class="btn-primary" onclick="loadSpeakers()">🔄 Refresh</button>
            </div>

            <div id="speakers-container" class="speakers-grid">
                <div class="empty-state">
                    <p>No speakers enrolled yet</p>
                    <p style="font-size: 14px; margin-top: 8px;">Click "Enroll Speaker" to add your first speaker</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/speakers.js"></script>
</body>
</html>
