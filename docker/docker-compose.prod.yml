version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    restart: always
    environment:
      - PYTHONOPTIMIZE=1
      - LOG_LEVEL=WARNING
    command: ["uvicorn", "src.adapters.presenters.web_api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "8", "--log-level", "warning"]
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 16G
        reservations:
          cpus: '4.0'
          memory: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Enable PostgreSQL in production
  postgres:
    image: postgres:15-alpine
    container_name: salvavidas-db
    restart: always
    environment:
      POSTGRES_DB: salvavidas
      POSTGRES_USER: salvavidas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - salvavidas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salvavidas"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Enable Redis in production
  redis:
    image: redis:7-alpine
    container_name: salvavidas-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - salvavidas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
